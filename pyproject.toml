[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "depth-estimator"
version = "0.1.0"
description = "Interactive object detection with yolo and depth estimation using stereo cameras"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Ahmed Mansour" }]
keywords = ["camera calibration", "stereo vision", "opencv", "computer vision", "yolo", "object detection", "disparity tuning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "opencv-python>=4.12,<5",
    "numpy>=1.26",
    "PyYAML>=6.0.1",
    "zope.interface>=6.1",
    "ultralytics>=8.3.242"
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
estimate-depth = "depth_estimator.services.Orchestrator:main"
tune-disparity = "depth_estimator.tuners.DisparityTuner:main"


[project.urls]
Homepage = "https://github.com/AMansour5/DepthEstimator"

[tool.setuptools.packages.find]
include = ["depth_estimator*"]
exclude = ["depth_estimator.tests*"]

[tool.setuptools.package-data]
"depth_estimator.config" = ["*.yaml"]